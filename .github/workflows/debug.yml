name: Debug
on:
  push:
    branches: [debug-lviv]
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: When each city was last checked
        run: |
          for i in $(seq 1 10); do
            npx -y wrangler@4 d1 execute loe-bot --remote --json \
              --command "SELECT key, substr(value, 1, 120) AS v FROM state WHERE key IN ('latest', 'latest:kyiv')" \
              > out.json || true
            date -u +%T; grep -o '"key": *"[^"]*"\|"v": *"{\\"at\\":[0-9]*' out.json | tr -d '\\' | paste -sd' ' || cat out.json
            sleep 12
          done
