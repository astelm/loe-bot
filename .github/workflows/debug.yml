name: Debug
on:
  push:
    branches: [debug-lviv]
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: How often LOE and Yasno change, seen from a Cloudflare Worker
        run: |
          cd probe
          npx -y wrangler@4 deploy | tee deploy.log
          url=$(grep -o 'https://[^ ]*workers\.dev' deploy.log | head -1)
          sleep 5
          for i in $(seq 1 24); do
            curl -sS --retry 3 --retry-all-errors "$url" | jq -c .
            sleep 10
          done
          npx -y wrangler@4 delete --force || true
