name: Debug
on:
  push:
    branches: [debug-lviv]
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Yasno endpoints in its web app
        run: bash probe/find.sh
      - name: Yasno from GitHub
        run: |
          B=https://app.yasno.ua/api/blackout-service/public/shutdowns
          curl -sS -m 30 "$B/regions/25/dsos/902/planned-outages" | head -c 1500; echo
          curl -sS -m 30 "$B/addresses/v2/regions" | head -c 800; echo
      - name: Yasno from a Cloudflare Worker
        run: |
          cd probe
          npx -y wrangler@4 deploy | tee deploy.log
          url=$(grep -o 'https://[^ ]*workers\.dev' deploy.log | head -1)
          sleep 5
          curl -sS --retry 3 --retry-all-errors "$url" | jq . | head -c 8000; echo
          npx -y wrangler@4 delete --force || true
