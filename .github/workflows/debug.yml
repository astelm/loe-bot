name: Debug Lviv
on:
  push:
    branches: [debug-lviv]
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Lviv state and a poll run
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "loe-bot") | (.uuid // .id)')
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$id/" wrangler.toml
          npx wrangler d1 execute loe-bot --remote --json --command "SELECT key, substr(value, 1, 300) v FROM state WHERE key = 'latest'" | jq -c '.[0].results'
          timeout 660 npx wrangler tail loe-bot --format json 2>/dev/null | jq -c --unbuffered 'select(.event.cron == "*/10 * * * *") | {cron: .event.cron, outcome, logs: [.logs[].message], ex: .exceptions, cpu: .cpuTime, wall: .wallTime}' | head -1 || true
          npx wrangler d1 execute loe-bot --remote --json --command "SELECT key, substr(value, 1, 300) v FROM state WHERE key = 'latest'" | jq -c '.[0].results'
