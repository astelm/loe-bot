name: Debug Lviv
on:
  push:
    branches: [debug-lviv]
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: LOE API from GitHub
        run: |
          curl -sS -m 30 -o loe.json -w 'status %{http_code}\n' 'https://api.loe.lviv.ua/api/menus?page=1&type=photo-grafic' -H 'Accept: application/json' || true
          jq -r '."hydra:member"[].menuItems[] | "=== \(.name) | raw=\(.rawHtml|length) mobile=\(.rawMobileHtml|length)\n\(.rawHtml)\n--- mobile\n\(.rawMobileHtml)"' loe.json | head -c 12000
      - name: LOE API from a Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd probe
          npx -y wrangler@4 deploy | tee deploy.log
          url=$(grep -o 'https://[^ ]*workers\.dev' deploy.log | head -1)
          sleep 5
          curl -sS --retry 3 --retry-all-errors "$url" | jq . | head -c 6000; echo
          npx -y wrangler@4 delete --force || true
