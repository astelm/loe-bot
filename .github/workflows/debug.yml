name: Debug
on:
  push:
    branches: [debug-lviv]
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Yasno from a Cloudflare Worker
        run: |
          cd probe
          npx -y wrangler@4 deploy | tee deploy.log
          url=$(grep -o 'https://[^ ]*workers\.dev' deploy.log | head -1)
          sleep 5
          curl -sS --retry 3 --retry-all-errors "$url" | jq . | head -c 8000; echo
          npx -y wrangler@4 delete --force || true
