name = "loe-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
# Every 10 minutes: check the LOE schedule (POLL_CRON in src/index.ts).
# Every minute: remind subscribers 15 minutes before an outage.
crons = ["*/10 * * * *", "* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "loe-bot"
database_id = "REPLACED_BY_DEPLOY_WORKFLOW"

[observability]
enabled = true
