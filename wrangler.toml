name = "loe-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
# All every minute, written differently so each is a separate run:
# LOE for Lviv (POLL_CRON in src/index.ts) and Yasno for Kyiv (KYIV_CRON), each
# checked twice a minute, and reminders 15 minutes before an outage.
crons = ["*/1 * * * *", "0-59 * * * *", "* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "loe-bot"
database_id = "REPLACED_BY_DEPLOY_WORKFLOW"

[observability]
enabled = true
